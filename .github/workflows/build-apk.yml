name: Build WiFi Frankenstein APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Diagnose Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list | grep -E 'platforms;android-(35|36|37)|build-tools;3[567]' || true

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WIFI-Frankenstein-Rootless
          path: app/build/outputs/apk/debug/*.apk
